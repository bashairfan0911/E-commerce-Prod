# Custom values for kube-prometheus-stack
# Use this file to customize the monitoring stack installation

prometheus:
  prometheusSpec:
    # Retention period for metrics
    retention: 7d
    
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    # Resource limits
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    
    # Service monitor selector
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  # Enable Grafana
  enabled: true
  
  # Admin credentials
  adminPassword: admin
  
  # Persistence
  persistence:
    enabled: true
    size: 5Gi
  
  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Grafana dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  
  # Pre-configured dashboards
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus

alertmanager:
  # Enable Alertmanager
  enabled: true
  
  # Resource limits
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# Node exporter configuration
nodeExporter:
  enabled: true

# Kube state metrics
kubeStateMetrics:
  enabled: true
