# Prometheus & Grafana Installation Instructions
# This file contains the installation steps for monitoring stack

# 1. Install Helm (if not already installed)
# curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
# chmod 700 get_helm.sh
# ./get_helm.sh

# 2. Add Helm repositories
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm repo add stable https://charts.helm.sh/stable
# helm repo update

# 3. Create monitoring namespace
# kubectl create namespace monitoring

# 4. Install kube-prometheus-stack (Prometheus + Grafana + Alertmanager)
# helm install prometheus prometheus-community/kube-prometheus-stack -n monitoring

# 5. Wait for all pods to be ready
# kubectl wait --for=condition=ready pod --all -n monitoring --timeout=300s

# 6. Access Prometheus (Port Forward)
# kubectl port-forward -n monitoring svc/prometheus-kube-prometheus-prometheus 9090:9090

# 7. Access Grafana (Port Forward)
# kubectl port-forward -n monitoring svc/prometheus-grafana 3000:80

# 8. Get Grafana admin password
# kubectl get secret -n monitoring prometheus-grafana -o jsonpath="{.data.admin-password}" | base64 -d; echo

# Access URLs:
# Prometheus: http://localhost:9090
# Grafana: http://localhost:3000
# Username: admin
# Password: (from step 8)
