# ArgoCD Installation Instructions
# This file contains the installation steps for ArgoCD

# 1. Create ArgoCD namespace
# kubectl create namespace argocd

# 2. Install ArgoCD
# kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

# 3. Wait for all pods to be ready
# kubectl wait --for=condition=ready pod --all -n argocd --timeout=300s

# 4. Expose ArgoCD server (for Kind cluster)
# kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "NodePort"}}'

# 5. Get ArgoCD admin password
# kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo

# 6. Port forward to access ArgoCD UI (for Kind cluster)
# kubectl port-forward svc/argocd-server -n argocd 8080:443

# Access ArgoCD at: https://localhost:8080
# Username: admin
# Password: (from step 5)
