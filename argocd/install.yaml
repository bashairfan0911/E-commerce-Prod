# ArgoCD Installation Script
# This file contains commands to install and configure ArgoCD

---
# Step 1: Create ArgoCD namespace
apiVersion: v1
kind: Namespace
metadata:
  name: argocd

---
# Step 2: Install ArgoCD
# Run: kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

---
# Step 3: Patch ArgoCD server service to NodePort
# Run: kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "NodePort"}}'

---
# Step 4: Get initial admin password
# Run: kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d; echo
