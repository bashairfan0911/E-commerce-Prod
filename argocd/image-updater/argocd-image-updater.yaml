# ArgoCD Image Updater Installation
# Automatically updates container images in ArgoCD applications

apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-image-updater
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater
  namespace: argocd
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-image-updater
subjects:
  - kind: ServiceAccount
    name: argocd-image-updater
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  registries.conf: |
    registries:
    - name: Docker Hub
      api_url: https://registry-1.docker.io
      ping: yes
      credentials: secret:argocd/docker-config#creds
      defaultns: library
      default: true
  
  log.level: info
  
  # Git commit settings
  git.user: argocd-image-updater
  git.email: argocd-image-updater@ekomart.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-ssh-config
  namespace: argocd
data:
  config: |
    Host *
      PubkeyAcceptedAlgorithms +ssh-rsa
      HostkeyAlgorithms +ssh-rsa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-image-updater
  template:
    metadata:
      labels:
        app: argocd-image-updater
    spec:
      serviceAccountName: argocd-image-updater
      containers:
        - name: argocd-image-updater
          image: argoprojlabs/argocd-image-updater:v0.12.2
          imagePullPolicy: Always
          args:
            - run
            - --interval
            - "2m"
            - --argocd-server-addr
            - argocd-server.argocd.svc.cluster.local:443
            - --argocd-insecure
            - --loglevel
            - info
            - --applications-api
            - argocd
          env:
            - name: APPLICATIONS_API
              value: argocd
            - name: ARGOCD_GRPC_WEB
              value: "true"
            - name: ARGOCD_SERVER
              value: argocd-server.argocd.svc.cluster.local:443
            - name: ARGOCD_INSECURE
              value: "true"
            - name: ARGOCD_PLAINTEXT
              value: "false"
          volumeMounts:
            - name: ssh-config
              mountPath: /app/config/ssh
            - name: ssh-known-hosts
              mountPath: /app/config/ssh/known_hosts
              subPath: known_hosts
      volumes:
        - name: ssh-config
          configMap:
            name: argocd-image-updater-ssh-config
        - name: ssh-known-hosts
          configMap:
            name: argocd-ssh-known-hosts-cm
            optional: true
---
# Secret for Docker Hub credentials (update with your credentials)
apiVersion: v1
kind: Secret
metadata:
  name: docker-config
  namespace: argocd
type: Opaque
stringData:
  creds: |
    # Format: username:password or username:token
    # Example: myuser:mypassword
