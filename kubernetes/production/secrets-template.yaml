# This is a template file. DO NOT commit actual secrets!
# Create actual secrets using kubectl or sealed-secrets

apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: ekomart
type: Opaque
stringData:
  mongodb-uri: "mongodb+srv://username:password@cluster.mongodb.net/ekomart?retryWrites=true&w=majority"
  jwt-secret: "your-jwt-secret-key-here"
  cloudinary-name: "your-cloudinary-name"
  cloudinary-key: "your-cloudinary-api-key"
  cloudinary-secret: "your-cloudinary-api-secret"
  razorpay-key-id: "your-razorpay-key-id"
  razorpay-key-secret: "your-razorpay-key-secret"

---
# To create the secret from command line:
# kubectl create secret generic backend-secrets \
#   --from-literal=mongodb-uri='your-mongodb-uri' \
#   --from-literal=jwt-secret='your-jwt-secret' \
#   --from-literal=cloudinary-name='your-cloudinary-name' \
#   --from-literal=cloudinary-key='your-cloudinary-key' \
#   --from-literal=cloudinary-secret='your-cloudinary-secret' \
#   --from-literal=razorpay-key-id='your-razorpay-key-id' \
#   --from-literal=razorpay-key-secret='your-razorpay-key-secret' \
#   -n ekomart
