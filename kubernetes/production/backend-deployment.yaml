apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: ekomart
  labels:
    app: backend
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: ${DOCKER_USERNAME}/ekomart-backend:test-dev
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DBURI
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mongodb-uri
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: cloudinary-name
            - name: CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: cloudinary-key
            - name: CLOUD_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: cloudinary-secret
            - name: KEY_ID
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: razorpay-key-id
            - name: KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: razorpay-key-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ekomart
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
