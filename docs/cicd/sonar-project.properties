# SonarQube Project Configuration
sonar.projectKey=ekomart
sonar.projectName=EkoMart E-Commerce
sonar.projectVersion=1.0

# Source code location
sonar.sources=backend,frontend
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js,**/coverage/**

# Backend specific settings
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Frontend specific settings
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Test coverage
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**

# Language settings
sonar.language=js,ts

# Encoding
sonar.sourceEncoding=UTF-8

# Additional settings
sonar.javascript.node.maxspace=4096
