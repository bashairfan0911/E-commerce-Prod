name: CI/CD Pipeline

on:
  push:
    branches: [ test-dev ]
  pull_request:
    branches: [ test-dev ]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ekomart'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --enableExperimental

      - name: Upload OWASP Dependency Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
        continue-on-error: true

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
        continue-on-error: true

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm test -- --coverage || true
        continue-on-error: true

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm test -- --coverage || true
        continue-on-error: true

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
        if: false  # Disabled - view results in SonarCloud dashboard instead

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [security-scan, owasp-dependency-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test-dev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ekomart-backend
          tags: |
            type=raw,value=test-dev
            type=sha,prefix=test-dev-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-backend:buildcache,mode=max

      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@master
        if: success()
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ekomart-backend:test-dev
          format: 'sarif'
          output: 'trivy-backend-image.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload backend Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: success() && hashFiles('trivy-backend-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-backend-image.sarif'
          category: 'trivy-backend-image'

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ekomart-frontend
          tags: |
            type=raw,value=test-dev
            type=sha,prefix=test-dev-

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=http://localhost:5001/
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-frontend:buildcache,mode=max

      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@master
        if: success()
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ekomart-frontend:test-dev
          format: 'sarif'
          output: 'trivy-frontend-image.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload frontend Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: success() && hashFiles('trivy-frontend-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend-image.sarif'
          category: 'trivy-frontend-image'

      - name: Image digest
        run: |
          echo "Backend Image: ${{ secrets.DOCKER_USERNAME }}/ekomart-backend"
          echo "Frontend Image: ${{ secrets.DOCKER_USERNAME }}/ekomart-frontend"
          echo "Tags: ${{ steps.meta-backend.outputs.tags }}"

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          echo "Pipeline completed!"
          echo "Status: ${{ needs.build-and-push.result }}"
