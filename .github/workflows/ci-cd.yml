name: CI/CD Pipeline

on:
  push:
    branches: [ test-dev ]
  pull_request:
    branches: [ test-dev ]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'

      - name: Run Trivy vulnerability scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ekomart'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
            --enableExperimental

      - name: Upload OWASP Dependency Check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run backend tests with coverage
        working-directory: ./backend
        run: npm run test:ci || npm test

      - name: Run frontend tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage || npm test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [security-scan, owasp-dependency-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test-dev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ekomart-backend
          tags: |
            type=raw,value=test-dev
            type=sha,prefix=test-dev-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-backend:buildcache,mode=max

      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@master
        if: success()
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ekomart-backend:test-dev
          format: 'sarif'
          output: 'trivy-backend-image.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload backend Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: success() && hashFiles('trivy-backend-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-backend-image.sarif'
          category: 'trivy-backend-image'

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ekomart-frontend
          tags: |
            type=raw,value=test-dev
            type=sha,prefix=test-dev-

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=http://localhost:5001/
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/ekomart-frontend:buildcache,mode=max

      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@master
        if: success()
        continue-on-error: true
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/ekomart-frontend:test-dev
          format: 'sarif'
          output: 'trivy-frontend-image.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload frontend Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: success() && hashFiles('trivy-frontend-image.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-frontend-image.sarif'
          category: 'trivy-frontend-image'

      - name: Image digest
        run: |
          echo "Backend Image: ${{ secrets.DOCKER_USERNAME }}/ekomart-backend"
          echo "Frontend Image: ${{ secrets.DOCKER_USERNAME }}/ekomart-frontend"
          echo "Tags: ${{ steps.meta-backend.outputs.tags }}"

  deploy-to-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/test-dev'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
        continue-on-error: true

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ekomart --dry-run=client -o yaml | kubectl apply -f -
        continue-on-error: true

      - name: Create secrets
        run: |
          kubectl create secret generic backend-secrets \
            --from-literal=mongodb-uri='${{ secrets.MONGODB_URI }}' \
            --from-literal=jwt-secret='${{ secrets.JWT_SECRET_KEY }}' \
            --from-literal=cloudinary-name='${{ secrets.CLOUD_NAME }}' \
            --from-literal=cloudinary-key='${{ secrets.CLOUD_API_KEY }}' \
            --from-literal=cloudinary-secret='${{ secrets.CLOUD_API_SECRET_KEY }}' \
            --from-literal=razorpay-key-id='${{ secrets.KEY_ID }}' \
            --from-literal=razorpay-key-secret='${{ secrets.KEY_SECRET }}' \
            -n ekomart \
            --dry-run=client -o yaml | kubectl apply -f -
        continue-on-error: true

      - name: Update image tags in manifests
        run: |
          cd kubernetes/production
          sed -i "s|\${DOCKER_USERNAME}|${{ secrets.DOCKER_USERNAME }}|g" backend-deployment.yaml
          sed -i "s|\${DOCKER_USERNAME}|${{ secrets.DOCKER_USERNAME }}|g" frontend-deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/production/namespace.yaml
          kubectl apply -f kubernetes/production/backend-deployment.yaml
          kubectl apply -f kubernetes/production/frontend-deployment.yaml
          kubectl apply -f kubernetes/production/ingress.yaml
        continue-on-error: true

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/backend-deployment -n ekomart --timeout=5m
          kubectl rollout status deployment/frontend-deployment -n ekomart --timeout=5m
        continue-on-error: true

      - name: Get deployment status
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n ekomart
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ekomart
          echo ""
          echo "=== Services ==="
          kubectl get services -n ekomart
        continue-on-error: true

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-to-kubernetes]
    if: always()
    
    steps:
      - name: Send notification
        run: |
          echo "Pipeline completed!"
          echo "Build Status: ${{ needs.build-and-push.result }}"
          echo "Deploy Status: ${{ needs.deploy-to-kubernetes.result }}"
