# SonarQube Project Configuration
sonar.projectKey=bashairfan0911_E-commerce-Prod
sonar.organization=bashairfan0911
sonar.projectName=EkoMart E-Commerce
sonar.projectVersion=1.0

# Source code location
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/coverage/**,**/seed*.js,**/clearAndSeed*.js,**/updateOldOrders.js,**/public/**,**/*.css,**/*.scss,**/*.html

# Backend specific settings
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Frontend specific settings
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Test coverage
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/tests/**,**/seed*.js,**/clearAndSeed*.js

# Language settings
sonar.language=js,ts

# Encoding
sonar.sourceEncoding=UTF-8

# Additional settings
sonar.javascript.node.maxspace=4096

# Code quality settings
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore console statements in specific files
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2589
sonar.issue.ignore.multicriteria.e1.resourceKey=**/index.js

# Ignore specific patterns
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S1135
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
